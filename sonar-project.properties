sonar.projectKey={your_project_key}
sonar.qualitygate.wait=true

# ----- Where is your code? -----
# Treat project root as source root; exclude tests and common non-prod folders.
sonar.sources=.
sonar.exclusions=**/tests/**,**/test*.py,**/*_test.py,**/migrations/**,**/.venv/**,**/venv/**,**/.pytest_cache/**
